# Render Blueprint — one-click deploy: Dashboard → New → Blueprint → pick this repo.
databases:
  - name: healthmate-db
    plan: free
    region: singapore
    databaseName: healthmate
    user: healthmate

services:
  - type: web
    name: healthmate-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY          # keep this value forever — it decrypts stored documents
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND         # free instances have no persistent disk → store encrypted files in Postgres
        value: db
      - key: LLM_PROVIDER            # demo | gemini | openai
        value: demo
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
