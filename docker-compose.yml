services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthmate
      POSTGRES_PASSWORD: healthmate
      POSTGRES_DB: healthmate
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthmate"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://healthmate:healthmate@db:5432/healthmate
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    volumes: [docdata:/app/.data]
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://api:8000 }
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  docdata:
